name: CTI verticals sync (weekly)

# Rebuilds the eight bookmark-gap verticals from their upstreams:
#   public/data/cti-bookmarks/ (Chick3nHawk01 cti-bookmarks.html)
#   public/data/lots/          (LOTS Project, lots-project.com)
#   public/data/malapi/        (MalAPI.io Windows API catalog)
#   public/data/car/           (mitre-attack/car, shallow git clone)
#   public/data/capec/         (mitre/cti CAPEC STIX 2.0, sparse git clone)
#   public/data/hijacklibs/    (hijacklibs.net/api JSON)
#   public/data/veris/         (vz-risk/VERIS enumerations)
#   public/data/engage/        (engage.mitre.org matrix)
# If the data changed, opens a PR and auto-merges it (data-only; main is
# unprotected), then self-deploys so the live site serves the fresh
# manifests. Per-request serving stays fully static (env.ASSETS).

on:
  schedule:
    # Mondays 07:30 UTC — staggered off the SI 06:00 slot.
    - cron: '30 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: cti-verticals-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Build CTI bookmarks manifest
        # Re-fetches the upstream bookmark HTML; per-entry live/reference/
        # missing tags are re-derived from the platform map in the script.
        continue-on-error: true
        run: node scripts/build-cti-bookmarks.mjs

      - name: Build LOTS manifest
        # Polite crawl (3 concurrent, 200ms delay) of lots-project.com.
        continue-on-error: true
        run: node scripts/build-lots-manifest.mjs

      - name: Build MalAPI manifest
        # Polite crawl (3 concurrent, 200ms delay) of malapi.io detail pages.
        continue-on-error: true
        run: node scripts/build-malapi-manifest.mjs

      - name: Build CAR manifest
        # Shallow git clone of mitre-attack/car into tmp; parsed with
        # js-yaml (build-time devDependency, never shipped to the Worker).
        continue-on-error: true
        run: node scripts/build-car-manifest.mjs

      - name: Build CAPEC manifest
        # Shallow sparse git clone of mitre/cti (capec/ only) into tmp.
        continue-on-error: true
        run: node scripts/build-capec-manifest.mjs

      - name: Build HijackLibs manifest
        # Single JSON fetch from hijacklibs.net/api.
        continue-on-error: true
        run: node scripts/build-hijacklibs-manifest.mjs

      - name: Build VERIS manifest
        # Two small JSON fetches from vz-risk/VERIS (CC BY-SA 4.0).
        continue-on-error: true
        run: node scripts/build-veris-manifest.mjs

      - name: Build Engage manifest
        # Single HTML fetch of the engage.mitre.org matrix page.
        continue-on-error: true
        run: node scripts/build-engage-manifest.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data changed files ==="
          git status --short public/data/cti-bookmarks/ public/data/lots/ public/data/malapi/ public/data/car/ public/data/capec/ public/data/hijacklibs/ public/data/veris/ public/data/engage/ | head -40

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(ti): sync CTI bookmark-gap verticals'
          title: "CTI verticals sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly rebuild of the eight bookmark-gap verticals.
            Each build step is isolated (`continue-on-error`) so one flaky
            upstream never aborts the remaining verticals. The PR is
            auto-merged by the same run (data-only changes; main is
            unprotected), and deploy.yml gates + deploys the merge on main.

            Sources:
            - Chick3nHawk01/Open_Source-CTI-Tooling (cti-bookmarks.html)
            - lots-project.com (Living Off Trusted Sites)
            - malapi.io (Windows API catalog)
            - mitre-attack/car (Cyber Analytics Repository, Apache-2.0)
            - mitre/cti CAPEC STIX 2.0 (attack patterns)
            - hijacklibs.net/api (DLL hijacking catalog)
            - vz-risk/VERIS (incident taxonomy, CC BY-SA 4.0)
            - engage.mitre.org (adversary engagement matrix)

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/cti-verticals-sync
          delete-branch: true
          add-paths: |
            public/data/cti-bookmarks/
            public/data/lots/
            public/data/malapi/
            public/data/car/
            public/data/capec/
            public/data/hijacklibs/
            public/data/veris/
            public/data/engage/

      - name: Auto-merge sync PR
        # Data-only output, main unprotected — merges itself (same pattern
        # as threat-intel-sync.yml).
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --merge --delete-branch

      # Why a guard instead of more `!= ''` skips: when this repo secret was
      # missing, every self-deploy step below skipped silently for days while
      # main raced ahead with fresh syncs, and the run stayed green - the live
      # site kept serving stale feeds with nothing in Actions marking why. A
      # missing token is a config error; make the run red instead.
      - name: Require CLOUDFLARE_API_TOKEN for self-deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing repo secret::CLOUDFLARE_API_TOKEN is not set - self-deploy steps would skip silently and the live site keeps serving stale feeds while main races ahead."
          echo "Fix: create a Cloudflare API token (Account Resources: Workers Scripts - Edit; User: Memberships + Details - Read) and set the repo secret:"
          echo "  gh secret set CLOUDFLARE_API_TOKEN --repo $GITHUB_REPOSITORY"
          echo "The sync PR still auto-merged into main; only the deploy was blocked."
          exit 1

      # ── Self-deploy (only when the sync PR actually landed) ──────────
      - name: Checkout merged main
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node for deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install for deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci --no-fund || npm install --no-fund
          cd api && npm ci --legacy-peer-deps

      - name: Build
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Smoke test cti-bookmarks manifest
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io/data/cti-bookmarks/index.json")
          echo "cti-bookmarks index -> HTTP $code"
          test "$code" = "200" || { echo "::error::cti-bookmarks index returned HTTP $code"; exit 1; }

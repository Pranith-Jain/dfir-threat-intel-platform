name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Run independently per PR so a slow run doesn't block a faster one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job runs the same checkout + setup (cached npm install dominates the
  # cold cost), but splitting them parallelises lint / typecheck / test and
  # makes a failing step obvious in the PR status block. The cost is one
  # extra setup per job (~10-15s with the cache hot).
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      # api/ has its own package.json + lockfile. The nested api/eslint.config.js
      # cascades under ESLint 10 flat config; without api/node_modules it
      # resolves typescript-eslint from the ROOT install (same module instance
      # as the root config), and both configs register their tsconfigRootDir
      # candidates into one shared set → "multiple candidate TSConfigRootDirs"
      # parse errors on every file without explicit parser options. A separate
      # instance per config dir keeps each set single-candidate.
      - name: install api deps
        working-directory: api
        run: npm ci --legacy-peer-deps
      # Zero-warning baseline: the codebase is currently clean (0 eslint
      # warnings across ~894 files after the no-explicit-any cleanup + the
      # hexagonal refactor). --max-warnings 0 keeps it that way — any new
      # warning fails CI. If a deliberate, hard-to-avoid warning is added,
      # raise this to that exact count (with a note) rather than leaving slack.
      - name: Lint (zero-warning baseline)
        run: npx eslint . --report-unused-disable-directives --max-warnings 0

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      # Two compilation units (root SPA + api/ worker). Run both — they catch
      # different things (root checks JSX + DOM types; api checks Workers /
      # Hono types under stricter `noUncheckedIndexedAccess`).
      - name: tsc (root)
        run: npx tsc --noEmit -p tsconfig.json
      # tsc (api) needs api/ deps — api/tsconfig.json references the
      # @cloudflare/vitest-pool-workers type defs, which root npm ci doesn't install.
      - name: install api deps
        working-directory: api
        run: npm ci --legacy-peer-deps
      - name: tsc (api)
        run: npx tsc --noEmit -p api/tsconfig.json
      # tsc (worker) — worker/ is in no other tsconfig. This config extends
      # api/tsconfig and adds ../worker, so it reuses the api/ deps installed
      # above and holds worker code to the same strictness as api (issue #89).
      - name: tsc (worker)
        run: npx tsc --noEmit -p api/tsconfig.worker.json

  test-root:
    name: Vitest + script tests (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      # Node:test suites for the data-pipeline scripts (mcp-manifest parser,
      # cert-in diff). These are unit tests for scripts that have no test
      # files in the vitest suite — they live under scripts/*.test.mjs and
      # are run as plain node --test.
      - name: Script unit tests
        run: npm run test:scripts
      - run: npm run test:run

  coverage:
    name: Coverage gate (protected surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      # Verifies every protected lib (rule-convert, detection-engine, etc.)
      # has at least one test file and meets its per-module coverage
      # threshold. Falls back to a "test-exists" check if the coverage
      # provider is not installed.
      - name: Check protected-surface coverage
        run: node scripts/check-coverage.mjs
      # Upload the full coverage report as a CI artifact so a human can
      # drill into any regression. The job itself only fails on threshold
      # breaches; the artifact is informational.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  test-api:
    # Quoted: the unquoted `api:` inside made YAML read this as a nested
    # mapping and fail to parse, which took down every CI run on the repo.
    name: "Vitest (api: lib + case-study + routes)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      # api/ has its own package.json + lockfile; @cloudflare/vitest-pool-workers
      # (used by api/vitest.config.ts) lives there, not in root deps. Install it
      # explicitly — root `npm ci` does not cover api/. --legacy-peer-deps because
      # npm ci in api/ does not read the repo-root .npmrc.
      - name: install api deps
        working-directory: api
        run: npm ci --legacy-peer-deps
      # The api suite runs under @cloudflare/vitest-pool-workers (miniflare).
      # Route tests run here too (they were long skipped; external /api/v1/*
      # reads are key-gated and every source helper degrades to empty). If
      # EADDRNOTAVAIL recurs under concurrency, set `fileParallelism: false`
      # in api/vitest.config.ts rather than skipping routes again.
      - name: build assets for ASSETS binding
        run: npm run build:client
      # test/durable-objects runs under miniflare too (the DO classes need the
      # Workers runtime, so they cannot live in the root jsdom suite).
      - name: api vitest (lib + case-study + durable-objects + health)
        working-directory: api
        run: npx vitest run test/lib test/case-study test/durable-objects test/health.test.ts
      - name: api vitest (routes)
        working-directory: api
        run: npx vitest run test/routes

  # Secret scan — catches API keys / tokens committed to source or history.
  # Allowlisted files (.env.example, docs, upstream data) are in .gitleaks.toml.
  # Runs on every push/PR to main. Uses gitleaks/gitleaks-action which scans
  # the full git diff of the PR (or the new commits on a push to main).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits in the push, not
          # just the working tree. Without this, only the final tree is
          # scanned and a secret that was added-then-removed in the same PR
          # would be missed.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The action reads .gitleaks.toml from the repo root by default.
          # GITHUB_TOKEN is auto-provided; the action uses it only for PR
          # comment posting, not for scanning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build + budget check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      - name: Build client
        run: npm run build:client
      - name: Budget check
        run: node scripts/check-budgets.mjs

  # Advisory only — reports whether CI can actually deploy, never blocks a PR.
  #
  # This workflow used to skip the deploy with a `::warning::` when
  # CLOUDFLARE_API_TOKEN was missing, so every push to main went green while
  # shipping nothing. Two secret names existed (CLOUDFLARE_API_TOKEN and
  # CF_API_TOKEN) and both were empty. surfacing it here means the gap is
  # visible in the PR status block instead of discovered in production.
  deploy-credentials:
    name: Deploy credentials present
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-fund
      - name: Report Cloudflare deploy secret status
        # `gh` is preinstalled on ubuntu runners; it authenticates as the
        # repo via GITHUB_TOKEN, which can read secret NAMES (never values).
        #
        # Advisory: the script's non-zero exit must not fail the job, or every
        # PR shows a red X for a repo-level config gap and people learn to
        # ignore the checks list. The hard stop lives in deploy.yml, where a
        # push to main actually fails.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-deploy-secrets.mjs && exit 0 || echo "::warning::Cloudflare deploy secret missing — pushes to main will FAIL at the deploy step until it is set."

name: Deploy

# Manual CD pipeline. CI (ci.yml) already gates every push/PR to main with
# lint + typecheck + test + budget; this workflow adds the one thing CI lacks:
# an actual deploy plus post-deploy verification.
#
# Continuous deployment: every push to main runs the gate (tsc + build +
# budgets) and then deploys.
#
# The deploy step REQUIRES CLOUDFLARE_API_TOKEN and fails without it. It used
# to skip with only a warning, which made every push look green while nothing
# shipped — see the "Deploy" step for the full reasoning. `workflow_dispatch`
# degrades to gate-only so the pipeline can be exercised without a token.
#
# To finish the setup:
#   1. Add CLOUDFLARE_API_TOKEN as a repository secret (a Cloudflare API token
#      with Workers Scripts:Edit).
#   2. Optionally add SMOKE_API_KEY (a readonly API key) to run the full
#      post-deploy smoke suite instead of just the public-page check.
#
# This is the single canonical Cloudflare secret name. A second name
# (CF_API_TOKEN) existed for telegram-mtproto-sync only, was never populated,
# and is now mapped from this one — see that workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Never cancel an in-progress deploy — a half-deployed worker is worse than a
# queued one. Concurrent triggers queue instead.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate + deploy + verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-fund
      # The worker bundle imports api/src, so the api/ deps (Workers/Hono types)
      # must be installed for the typecheck + build to pass — same as ci.yml.
      - name: install api deps
        working-directory: api
        run: npm ci --legacy-peer-deps

      # ── Pre-flight gate (the three compilation units CI enforces) ───
      - name: tsc (root)
        run: npx tsc --noEmit -p tsconfig.json
      - name: tsc (api)
        run: npx tsc --noEmit -p api/tsconfig.json
      - name: tsc (worker)
        run: npx tsc --noEmit -p api/tsconfig.worker.json

      # ── Build (client + SSR + prerender) and bundle budget ─────────
      - name: Build
        run: npm run build
      - name: Budget check
        run: node scripts/check-budgets.mjs

      # ── OG page cards → KV_CACHE (must precede the deploy) ─────────
      # Cards must land in KV BEFORE the new worker goes live: every page's
      # og:image is versioned per git SHA (/og-image/v<sha>/page/<dot>.png —
      # worker/og-version.generated.ts), so the freshly deployed worker would
      # otherwise serve meta URLs whose KV keys don't exist yet. The script
      # fails soft (exit 0 + warnings on per-key failures), so a partial
      # upload just degrades to dynamic in-Worker rasterization instead of
      # blocking the deploy.
      - name: Upload OG page cards to KV
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run og:upload

      # ── Deploy ──────────────────────────────────────────────────────
      # A missing token now FAILS the job instead of warning and continuing.
      #
      # It used to skip with a warning, which meant a green run with nothing
      # deployed: every push to main reported "success" while the Worker stayed
      # on whatever version a local `wrangler deploy` happened to have pushed.
      # That hid a broken deploy pipeline for the lifetime of this workflow.
      # `workflow_dispatch` still degrades to a gate-only run, so the pipeline
      # can be exercised without a token.
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — refusing to report a green deploy that deploys nothing."
            echo "Add it with: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
      - name: Gate only (no token; manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN is not set — running the gate only, no deploy."
          echo "::warning::Pushes to main will FAIL until the secret is added."

      # ── Post-deploy verification ───────────────────────────────────
      # Basic liveness: the prerendered shell + two app landings must serve 200.
      - name: Smoke — public pages are live
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          sleep 8
          for path in / /dfir /threatintel; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io$path")
            echo "$path -> HTTP $code"
            test "$code" = "200" || { echo "::error::$path returned HTTP $code after deploy"; exit 1; }
          done
      # End-to-end OG check: with a Twitterbot UA the worker must rewrite
      # /about's og:image to the SHA-versioned card URL AND that card must
      # actually serve from KV as image/png — the exact X-crawler failure
      # mode this pipeline exists to prevent.
      - name: Smoke — OG card serves from KV (Twitterbot)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          sleep 8  # extra propagation margin on top of the public-pages wait
          ua="Twitterbot/1.0"
          html=$(curl -sS -A "$ua" "https://pranithjain.qzz.io/about")
          # The <meta> tag can span lines and attribute order varies — flatten
          # newlines first, then try both property/content orders.
          flat=$(printf '%s' "$html" | tr '\n' ' ')
          og=$(printf '%s' "$flat" | grep -o 'property="og:image"[^>]*content="[^"]*"' | head -1 | sed 's/.*content="\([^"]*\)".*/\1/')
          if [ -z "$og" ]; then
            og=$(printf '%s' "$flat" | grep -o 'content="[^"]*"[^>]*property="og:image"' | head -1 | sed 's/^content="\([^"]*\)".*/\1/')
          fi
          echo "og:image -> ${og:-<not found>}"
          case "$og" in
            https://pranithjain.qzz.io/og-image/v*/page/about.png) ;;
            *)
              echo "::error::/about did not serve a versioned page-card og:image under Twitterbot (got: ${og:-nothing})"
              exit 1
              ;;
          esac
          out=$(curl -sS -A "$ua" -o /dev/null -w '%{http_code} %{content_type}' "$og")
          code=${out%% *}
          ctype=${out#* }
          echo "card -> HTTP $code ($ctype)"
          if [ "$code" != "200" ] || ! printf '%s' "$ctype" | grep -qi 'image/png'; then
            echo "::error::OG card $og returned HTTP $code with content-type '$ctype' (expected 200 + image/png)"
            exit 1
          fi
      # Full suite (keyed endpoints) — only when a smoke key is configured.
      - name: Smoke — full suite
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.SMOKE_API_KEY != '' }}
        run: node scripts/smoke.mjs

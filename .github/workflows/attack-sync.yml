name: MITRE ATT&CK upstream sync (weekly)

# Regenerates the MITRE ATT&CK artifacts from the upstream CTI bundle:
#
#   src/data/dfir/mitre-matrix.ts   the full matrix (tactic + technique titles)
#   api/src/lib/mitre-tactics.ts     the canonical ordered tactic list
#   public/data/attack-id-index.json the id → name/technique index
#   public/data/actor-kb.json        the actor (intrusion-set) knowledge base
#
# WHY THIS EXISTS
#
# The ATT&CK artifacts were regenerated by hand, which is how they fell two
# releases behind. Worse, the API kept its OWN hand-written copy of the
# tactic list in three files, so the v3.3 spec's split of `defense-evasion`
# into `stealth` (TA0005) and `defense-impairment` (TA0112) silently
# dropped 204 techniques from the attack navigator and sorted them to the
# end of every kill chain.
#
# The tactic list is now generated from the same fetch as the matrix, and
# `src/__tests__/mitre-tactics.test.ts` pins the two against each other — so
# a taxonomy change can no longer leave the API behind. This workflow keeps
# the DATA current so the guard is checking something real.
#
# If the data changed, it opens a PR with the diff so a human can review +
# merge. The diff is the point: an ATT&CK release is a reviewable change,
# not something to auto-merge blind.

on:
  schedule:
    # Thursdays 04:30 UTC — after the Tuesday/Thursday data-sync waves, and
    # clear of the hourly feed cron.
    - cron: "30 4 * * 4"
  workflow_dispatch: {}

concurrency:
  group: attack-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Regenerate the ATT&CK matrix and tactic list
        # Writes src/data/dfir/mitre-matrix.ts and api/src/lib/mitre-tactics.ts
        # from the same upstream fetch, so the two cannot disagree.
        run: node scripts/generate-mitre-matrix.mjs

      - name: Rebuild the technique id index
        run: node scripts/build-attack-index.mjs

      - name: Rebuild the actor knowledge base
        run: node scripts/build-actor-kb.mjs

      - name: Verify the tactic list still matches the matrix
        # The guard that catches a taxonomy change the API has not caught up
        # with. Fails the sync rather than opening a broken PR.
        run: npx vitest run src/__tests__/mitre-tactics.test.ts

      - name: Show diff stat
        run: |
          echo "=== ATT&CK artifacts changed ==="
          git status --short src/data/dfir/mitre-matrix.ts api/src/lib/mitre-tactics.ts \
            public/data/attack-id-index.json public/data/actor-kb.json
          echo "=== tactic count ==="
          grep -c 'short_name:' api/src/lib/mitre-tactics.ts || true

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(attack): sync from mitre/cti"
          title: "MITRE ATT&CK upstream sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly sync of the MITRE ATT&CK artifacts from
            [mitre/cti](https://github.com/mitre/cti) (enterprise-attack).

            Regenerates:
            - `src/data/dfir/mitre-matrix.ts` — tactic + technique titles
            - `api/src/lib/mitre-tactics.ts` — the canonical ordered tactic list
            - `public/data/attack-id-index.json` — the id → name index
            - `public/data/actor-kb.json` — the actor knowledge base

            Review the diff before merging: an ATT&CK release is a real
            change to the taxonomy the platform reasons over, and the tactic
            list is generated from the same fetch as the matrix so the two
            move together.

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/attack-upstream-sync
          delete-branch: true
          add-paths: |
            src/data/dfir/mitre-matrix.ts
            api/src/lib/mitre-tactics.ts
            public/data/attack-id-index.json
            public/data/actor-kb.json

name: AI-security verticals sync (weekly)

# Rebuilds the AI-security verticals from their upstreams:
#   public/data/cairn/   (Cisco-Talos CAIRN: 26 YARA rules, 27 filters,
#                          12 archetypes, 10 family reports — MIT)
#   public/data/nova/    (Nova-Hunting nova-rules: 69 .nov rules + taxonomy — MIT)
#   public/data/denali/  (transilienceai denali: 9 rules, taxonomy, 38 ADRs — Apache-2.0)
#   public/data/ai-playbook/ (aisecurity.zone: 8 divisions, 20 risk identifiers —
#                          NO reuse licence, so STRUCTURE ONLY: no prose is replicated)
#   public/data/orca/    (Orca-AI-Incident-Archive: 417 AI agent incidents — CC BY 4.0)
#   public/data/hi/      (hackingincidents.ai: 286 graded AI-assisted attacks — no licence, links only)
#   public/data/oh/      (offsecharnesses.ai: 154 offensive-AI harnesses — no licence, links only)
#   public/data/kp/      (kitploit.com/en: public HTML + RSS only — /api/ disallowed by robots.txt)
#   public/data/cheyenne-tool/ (MJCruickshank/cheyenne: catalog + CelesTrak TLE snapshot for the working board)
# If the data changed, opens a PR and auto-merges it (data-only; main is
# unprotected). There is no self-deploy here: the merge push runs deploy.yml,
# which publishes the fresh manifests. Per-request serving stays static
# (env.ASSETS).

on:
  schedule:
    # Tuesdays 07:30 UTC — staggered off the CTI 07:30-Monday slot.
    - cron: "30 7 * * 2"
  workflow_dispatch: {}

concurrency:
  group: ai-security-verticals-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Build CAIRN manifest
        # Raw fetches from Cisco-Talos/CAIRN (yara_rules.yar,
        # acquisition_filters.yaml, 10 family reports).
        continue-on-error: true
        run: node scripts/build-cairn-manifest.mjs

      - name: Build NOVA manifest
        # GitHub tree API + raw fetches from Nova-Hunting/nova-rules (*.nov).
        continue-on-error: true
        run: node scripts/build-nova-manifest.mjs

      - name: Build Denali manifest
        # GitHub tree API + raw fetches from transilienceai/denali (36 ADRs + roadmap).
        # Rule catalog + taxonomy are transcribed in the script (no fetch needed).
        continue-on-error: true
        run: node scripts/build-denali-manifest.mjs

      - name: Build AI Security Playbook index
        # Structure only: 8 system divisions + 20 risk identifiers. Upstream has
        # no reuse licence, so no chapter prose is fetched or stored. The script
        # asserts the recorded identifiers are still present and warns on drift.
        continue-on-error: true
        run: node scripts/build-ai-playbook.mjs

      - name: Build ORCA incident archive manifest
        # Fetches dist/incidents.json (schema 2) + dist/stats.json from
        # Continuum-AI-Corp/Orca-AI-Incident-Archive and slices into month
        # shards. CC BY 4.0 — attribution carried in every emitted file.
        continue-on-error: true
        run: node scripts/build-orca-manifest.mjs

      - name: Build Agentic Attack Detections manifest
        # GitHub tree API + raw files from ThreatDefence/agentic-attack-detections
        # (MIT): framework coverage, 1,800+ sourced indicators, ATT&CK layer.
        continue-on-error: true
        run: node scripts/build-aad-manifest.mjs

      - name: Build PromptIntel IoPC taxonomy mirror
        # Public /taxonomy/ pages on promptintel.securitybreak.io (robots
        # Allow: /). Metadata + framework mappings only; no attack text and
        # no API key, so the taxonomy surface costs zero PromptIntel quota.
        continue-on-error: true
        run: node scripts/sync-promptintel.mjs

      - name: Build PRTF physical red-team taxonomy
        # redteam.vip/prtf is CC BY 4.0 — the build parses the embedded JS
        # literals with acorn (never eval) and emits attributed JSON.
        continue-on-error: true
        run: node scripts/build-prtf.mjs

      - name: Build OWASP GenAI Threat Intelligence feed
        # Public STIX 2.1 bundle from aithreatintelfeed.org, generated from the
        # GenAI-Security-Project repo (no project licence — metadata + links).
        continue-on-error: true
        run: node scripts/build-ai-cti-feed.mjs

      - name: Build Atomic Red Team manifest
        # GitHub tree API + 353 raw technique YAMLs from redcanaryco/
        # atomic-red-team (MIT), the catalog behind atomicredteam.io. Metadata
        # only — executor commands are never vendored.
        continue-on-error: true
        run: node scripts/build-art-manifest.mjs

      - name: Build Hacking Incidents manifest
        # Fetches /incidents.json from hackingincidents.ai (robots Allow: /).
        # No upstream licence: only metadata + links are emitted.
        continue-on-error: true
        run: node scripts/build-hi-manifest.mjs

      - name: Build Offsec Harness Index manifest
        # Fetches /data.json + /status.json from offsecharnesses.ai
        # (robots Allow: /). No upstream licence: metadata + links only.
        continue-on-error: true
        run: node scripts/build-oh-manifest.mjs

      - name: Build Cheyenne tool snapshot
        # Upstream fleet catalog + CelesTrak active TLEs, filtered to the 23
        # catalogue fleets. No upstream code or prose is vendored.
        continue-on-error: true
        run: node scripts/build-cheyenne-tool.mjs

      - name: Build Kitploit directory manifest
        # Crawls /en, /en/tools and the three public RSS feeds. robots.txt
        # disallows /api/, so the builder never calls the upstream JSON API.
        continue-on-error: true
        run: node scripts/build-kp-manifest.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data changed files ==="
          git status --short public/data/cairn/ public/data/nova/ public/data/denali/ public/data/ai-playbook/ public/data/orca/ public/data/aad/ public/data/art/ public/data/hi/ public/data/oh/ public/data/kp/ public/data/cheyenne-tool/ public/data/prtf/ public/data/ai-cti-feed/ | head -60

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(ti): sync AI-security verticals (cairn/nova/denali/orca/aad/art/hi/oh/kp/cheyenne-tool)"
          title: "AI-security verticals sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly rebuild of the AI-security verticals.
            Each build step is isolated (`continue-on-error`) so one flaky
            upstream never aborts the remaining verticals. The PR is
            auto-merged by the same run (data-only changes; main is
            unprotected), and deploy.yml gates + deploys the merge on main.

            Sources:
            - Cisco-Talos/Cognitive-Artifact-Intelligence-Research-Network (MIT)
            - Nova-Hunting/nova-rules + nova-framework taxonomy (MIT)
            - transilienceai/denali ADRs + roadmap (Apache-2.0)
            - aisecurity.zone (NO reuse licence — structure/identifiers only,
              no prose replicated; every record deep-links upstream)
            - Continuum-AI-Corp/Orca-AI-Incident-Archive (CC BY 4.0)
            - ThreatDefence/agentic-attack-detections (MIT)
            - redcanaryco/atomic-red-team (MIT, via atomicredteam.io docs)
            - hackingincidents.ai (NO reuse licence — structured metadata and links only)
            - offsecharnesses.ai (NO reuse licence — structured metadata and links only)
            - kitploit.com/en (robots.txt disallows /api/ — public HTML and RSS only)
            - MJCruickshank/cheyenne (no licence — re-implemented in-site; catalog + CelesTrak TLEs only)

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/ai-security-verticals-sync
          delete-branch: true
          add-paths: |
            public/data/cairn/
            public/data/nova/
            public/data/denali/
            public/data/ai-playbook/
            public/data/orca/
            public/data/aad/
            public/data/art/
            public/data/hi/
            public/data/oh/
            public/data/kp/
            public/data/cheyenne-tool/
            public/data/prtf/
            public/data/ai-cti-feed/

      - name: Auto-merge sync PR
        # Data-only output, main unprotected — merges itself (same pattern
        # as threat-intel-sync.yml).
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"

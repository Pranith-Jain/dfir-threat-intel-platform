name: AI Threat Actors sync (weekly)

on:
  schedule:
    # Mondays 06:30 UTC — staggered 30 min after the SI + daily-briefs 06:00
    # slot (all three used to fire the same minute).
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ai-threats-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Sync upstream (Cybershujin tracker)
        run: node scripts/sync-ai-threats.mjs

      - name: Build manifest
        run: node scripts/build-ai-threats.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data/ai-threats/ changed files ==="
          git status --short public/data/ai-threats/ | head -40
          echo "=== staging folder size ==="
          du -sh ai-threats-staging/ || true

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ai-threats): sync AI threat actors from Cybershujin tracker"
          title: "AI Threat Actors upstream sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly sync of AI threat actor intelligence data.

            Re-runs `scripts/sync-ai-threats.mjs` (Cybershujin tracker) and
            `scripts/build-ai-threats.mjs` (manifest rebuild). Review the diff
            in `public/data/ai-threats/` and merge if the data looks correct.

            Source: https://cybershujin.github.io/Threat-Actors-use-of-Artifical-Intelligence/

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/ai-threats-sync
          delete-branch: true
          add-paths: |
            public/data/ai-threats/
            ai-threats-staging/

      - name: Auto-merge sync PR
        # The sync output is data-only and main is unprotected, so the PR
        # merges itself here — no human in the loop for the routine data land.
        # (create-pull-request outputs nothing when there were no changes.)
        # The shared script tolerates the non-required `Workers Builds:`
        # Cloudflare watcher check failing on bot PRs, which left these PRs
        # UNSTABLE and unmerged for days (see the script header).
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/automerge-sync-pr.sh "${{ steps.pr.outputs.pull-request-number }}"

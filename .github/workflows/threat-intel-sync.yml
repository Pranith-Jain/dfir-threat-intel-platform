name: Threat Intel sync (daily)

# Re-fetches NVD recent CVEs, CISA KEV, and Daily-Hunt IOC families,
# then rebuilds the public/data/threat-intel/ manifest. If the data
# changed, opens a PR and auto-merges it into main so the data lands
# the same day (main is unprotected; the merge is data-only).
#
# The job then builds + deploys itself: the auto-merge runs on
# github.token, and GitHub does not trigger other workflows (deploy.yml)
# for GITHUB_TOKEN pushes — so without this self-deploy the live site
# would serve yesterday's manifest until the next manual deploy.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: ti-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Sync upstream (NVD + CISA KEV + Daily-Hunt + awesome-lists)
        # One flaky upstream (NVD frequently exceeds 30-90s under API load)
        # must not abort the other verticals — each sync step is isolated.
        continue-on-error: true
        run: node scripts/sync-threat-intel.mjs

      - name: Sync darknetlist.is directory
        continue-on-error: true
        run: node scripts/sync-darknetlist.mjs

      - name: Sync ThreatCluster feeds
        continue-on-error: true
        run: node scripts/sync-threatcluster.mjs

      - name: Sync dPhish phishing feed (TAXII 2.1)
        continue-on-error: true
        run: node scripts/sync-dphish.mjs

      - name: Sync CTIWatch (ctiwatch.com)
        continue-on-error: true
        run: node scripts/sync-ctiwatch.mjs

      - name: Sync Destroylist phishing blacklist
        continue-on-error: true
        run: node scripts/sync-destroylist.mjs

      - name: Sync Living Threat Repository (MITRE-mapped incidents)
        continue-on-error: true
        run: node scripts/sync-living-threat.mjs

      - name: Sync MalwareAnalyzer by Cyble feeds
        continue-on-error: true
        run: node scripts/sync-malwareanalyzer.mjs

      - name: Sync cve.now aggregate vulnerability feed
        # Newest ~240 upstream entries (deduplicated cross-source records:
        # CVE List, NVD, KEV, GHSA, OSV, EUVD, EPSS, Exploit-DB, Metasploit,
        # Nuclei, PoC-in-GitHub) + per-source polling health. Keyless.
        continue-on-error: true
        run: node scripts/sync-cve-now.mjs

      - name: Sync Incident Desk briefings (RSS)
        # Emergency incident briefings through an identity lens. Keyless RSS.
        continue-on-error: true
        run: node scripts/sync-incident-desk.mjs

      - name: Sync Threaticon catalog (actors, malware, coverage, map)
        # The main threaticon vertical (actor profiles, malware dictionary,
        # detection coverage, threat map) — previously only the extended
        # catalog was automated. Resumable crawl, 429 backoff built in.
        continue-on-error: true
        run: node scripts/sync-threaticon.mjs --concurrency 1 --gap-ms 1300

      - name: Sync LeakScope (breach / dark-forum leak index)
        # Metadata only — the upstream index carries no URL to any leak, and
        # the sync strips every URL-shaped column before writing.
        continue-on-error: true
        run: node scripts/sync-leakscope.mjs

      - name: Sync DarkForums IP intelligence
        # 41 MB of forum IP/actor observations + the DB-IP country ranges.
        continue-on-error: true
        run: node scripts/sync-darkforums-ip.mjs

      - name: Sync forum actor directory (Actores Maliciosos)
        # 149 MB MyBB dump behind Git LFS. The build drops credential
        # material and every misaligned row before anything is written.
        continue-on-error: true
        run: node scripts/sync-actor-forums.mjs

      - name: Build LeakScope manifest
        continue-on-error: true
        run: node scripts/build-leakscope.mjs

      - name: Build DarkForums IP manifest
        continue-on-error: true
        run: node scripts/build-darkforums-ip.mjs

      - name: Build forum actor manifest
        continue-on-error: true
        run: node scripts/build-actor-forums.mjs

      - name: Build manifest
        continue-on-error: true
        run: node scripts/build-threat-intel.mjs

      - name: Build darknetlist manifest
        continue-on-error: true
        run: node scripts/build-darknetlist.mjs

      - name: Build ThreatCluster manifest
        continue-on-error: true
        run: node scripts/build-threatcluster.mjs

      - name: Build ThreatCluster entities
        # build-threatcluster wipes threatcluster/ (incl. entities/) — this
        # step must re-derive the entity tree or every run deletes it.
        continue-on-error: true
        run: node scripts/build-tc-entities.mjs

      - name: Build dPhish manifest
        continue-on-error: true
        run: node scripts/build-dphish.mjs

      - name: Build CTIWatch manifest
        continue-on-error: true
        run: node scripts/build-ctiwatch.mjs

      - name: Build Destroylist manifest
        continue-on-error: true
        run: node scripts/build-destroylist.mjs

      - name: Build Living Threat manifest
        continue-on-error: true
        run: node scripts/build-living-threat.mjs

      - name: Build MalwareAnalyzer manifest
        continue-on-error: true
        run: node scripts/build-malwareanalyzer.mjs

      - name: Build cve.now manifest
        continue-on-error: true
        run: node scripts/build-cve-now.mjs

      - name: Build Incident Desk manifest
        continue-on-error: true
        run: node scripts/build-incident-desk.mjs

      - name: Build Threaticon manifest
        continue-on-error: true
        run: node scripts/build-threaticon.mjs

      - name: Sync detection.wiki (rules + labs via Playwright)
        continue-on-error: true
        run: node scripts/sync-detection-wiki.mjs

      - name: Build detection.wiki manifest
        continue-on-error: true
        run: node scripts/build-detection-wiki.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data/threat-intel/ changed files ==="
          git status --short public/data/threat-intel/ | head -40
          echo "=== staging folder size ==="
          du -sh threat-intel-staging/ || true

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(ti): sync threat intel from upstream sources'
          title: "Threat Intel upstream sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated daily sync of threat intelligence data.

            Re-runs `scripts/sync-threat-intel.mjs` (NVD recent + CISA KEV +
            Daily-Hunt sparse git clone + mthcht/awesome-lists detection CSVs)
            and `scripts/build-threat-intel.mjs` (manifest rebuild). Also syncs
            the darknetlist.is Tor site directory
            (`scripts/sync-darknetlist.mjs` + `scripts/build-darknetlist.mjs`),
            the ThreatCluster public feeds
            (`scripts/sync-threatcluster.mjs` + `scripts/build-threatcluster.mjs`),
            and the dPhish public TAXII 2.1 phishing feed
            (`scripts/sync-dphish.mjs` + `scripts/build-dphish.mjs`).
            Also syncs the Living Threat Repository MITRE-mapped incidents
            (`scripts/sync-living-threat.mjs` + `scripts/build-living-threat.mjs`)
            and the MalwareAnalyzer by Cyble URL feeds
            (`scripts/sync-malwareanalyzer.mjs` + `scripts/build-malwareanalyzer.mjs`),
            and the Threaticon main vertical — actor profiles, malware
            dictionary, detection coverage, threat map
            (`scripts/sync-threaticon.mjs` + `scripts/build-threaticon.mjs`,
            paced at 1 req/s for the free-tier rate limits). Each sync/build
            step is isolated (`continue-on-error`) so one flaky upstream
            never aborts the remaining verticals. The PR is auto-merged by
            the same run (data-only changes; main is unprotected), and
            deploy.yml gates + deploys the merge on main.
            Review the diff in `public/data/threat-intel/` if you want to
            audit the data.

            Sources:
            - NVD (recent CVEs, last 7 days)
            - CISA Known Exploited Vulnerabilities catalog
            - TheRavenFile/Daily-Hunt (IOC family files)
            - mthcht/awesome-lists (SOC/DFIR detection-list CSVs)
            - darknetlist.is (Tor site directory, 108 sites across 9 categories)
            - threatcluster.io (5 public feeds: trending clusters, vulnerabilities,
              exploits, dark-web victims, IOC blocklist + MISP manifest)
            - dphish.com (public TAXII 2.1 collection: phishing domains, URLs,
              sender IPs, phone numbers, attachment rules)
            - living-threat.rabitanoor.com (Living Threat Repository — newest
              5000 of ~21k incidents mapped to MITRE ATT&CK chains)
            - malwareanalyzer.com (MalwareAnalyzer by Cyble — malicious +
              newly-observed URL feeds, keyless)
            - cve.now (aggregate vulnerability feed — newest ~240
              deduplicated cross-source CVE entries + source health, keyless)
            - iamnicholasmartin.co.uk/incidents (Incident Desk —
              identity-lens live-incident briefings, public RSS)
            - detection.wiki (15,957 detection rules from Sigma, Elastic,
              Splunk, Kusto mapped to MITRE ATT&CK + detection labs)

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/threat-intel-sync
          delete-branch: true
          add-paths: |
            public/data/threat-intel/
            public/data/detection-wiki/
            threat-intel-staging/
            detection-wiki-staging/

      - name: Auto-merge sync PR
        # The sync output is data-only and main is unprotected, so the PR
        # merges itself here — no human in the loop for the daily data land.
        # (create-pull-request outputs nothing when there were no changes.)
        #
        # NOTE: this merge runs on github.token, and GitHub deliberately does
        # NOT trigger other workflows (deploy.yml) for GITHUB_TOKEN pushes.
        # The old comment claimed "deploy.yml gates + deploys the merge" — it
        # never fired, leaving the live site on yesterday's manifest while
        # main raced ahead. The build + deploy below closes that gap (same
        # pattern as breach-watch-sync.yml).
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --merge --delete-branch

      # Why a guard instead of more `!= ''` skips: when this repo secret was
      # missing, every self-deploy step below skipped silently for days while
      # main raced ahead with fresh syncs, and the run stayed green — the live
      # site kept serving stale feeds with nothing in Actions marking why. A
      # missing token is a config error; make the run red instead.
      - name: Require CLOUDFLARE_API_TOKEN for self-deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing repo secret::CLOUDFLARE_API_TOKEN is not set — self-deploy steps would skip silently and the live site keeps serving stale feeds while main races ahead."
          echo "Fix: create a Cloudflare API token (Account Resources: Workers Scripts — Edit; User: Memberships + Details — Read) and set the repo secret:"
          echo "  gh secret set CLOUDFLARE_API_TOKEN --repo $GITHUB_REPOSITORY"
          echo "The sync PR still auto-merged into main; only the deploy was blocked."
          exit 1

      # ── Self-deploy (only when the sync PR actually landed) ──────────
      - name: Checkout merged main
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node for deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install for deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci --no-fund || npm install --no-fund
          cd api && npm ci --legacy-peer-deps

      - name: Build
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Smoke test threatcluster manifest
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io/data/threat-intel/threatcluster/index.json")
          echo "threatcluster index -> HTTP $code"
          test "$code" = "200" || { echo "::error::threatcluster index returned HTTP $code"; exit 1; }
          for m in cve-now incident-desk; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io/data/threat-intel/$m/index.json")
            echo "$m index -> HTTP $code"
            test "$code" = "200" || { echo "::error::$m index returned HTTP $code"; exit 1; }
          done

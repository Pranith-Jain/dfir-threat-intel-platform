name: ETDA Actors Sync

on:
  schedule:
    # Every Monday and Thursday at 05:00 UTC
    - cron: '0 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etda-actors-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Sync ETDA actors
        run: node scripts/sync-etda-actors.mjs

      - name: Build manifest
        run: node scripts/build-etda-actors.mjs

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain public/data/apt-actors/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(apt-actors): weekly ETDA actor sync'
          title: 'chore(apt-actors): weekly ETDA actor sync'
          body: |
            Automated weekly sync of ETDA Threat Group Cards data.

            Updates `public/data/apt-actors/` with the latest actor
            metadata from apt.etda.or.th and the APTmap relationship graph.

            Review the diff for:
            - New or renamed actor groups
            - Changes in observed sectors/tools
            - APTmap graph changes
            - Index metadata changes
          branch: etda-actors-sync
          base: main
          labels: automated, data, threat-intel
          add-paths: |
            public/data/apt-actors/
          delete-branch: true

      - name: Auto-merge sync PR
        # Data-only output, so it merges itself once checks clear (same
        # pattern as ai-security-verticals-sync.yml). Without this the PR sits
        # open forever and its branch accumulates one ref per run — which is
        # how `etda-actors-sync` and `chore/ransomware-groups-sync` piled up.
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash --delete-branch \
            "${{ steps.pr.outputs.pull-request-number }}"

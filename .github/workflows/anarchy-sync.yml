name: Anarchy sync (daily)

# Replicates KazamaDono's Anarchy portal (kazamadono.github.io) — 1,708 courses
# across 20 tracks (AI/ML, Low Level, PsyOps, Defensive/Offensive, OSINT, Game
# Hacking, BugBounty, Crypto, Reversing, Cloud, Forensics, CTF, Blockchain,
# IoT/HW, Dev/CS, Math). Daily sync at 06:00 UTC, mirrored with attribution
# into public/data/anarchy/ (static ASSETS, no D1/KV). The SPA at /anarchy
# replicates the original portal's search + filter + binary-rain aesthetic.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: anarchy-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Sync Anarchy catalog
        id: sync
        # Upstream (kazamadono.github.io) was retired upstream: the GitHub user
        # was deleted and every URL on the host 404s. Treat an unreachable
        # upstream as "nothing to commit — keep serving the committed catalog"
        # instead of failing the whole daily run; the moment the portal comes
        # back the regular sync/build/commit/deploy path runs again unchanged.
        run: |
          if ! node scripts/sync-anarchy.mjs; then
            echo "::warning::Anarchy upstream (kazamadono.github.io) unreachable — keeping the committed catalog; skipping build/commit/deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.sync.outputs.skip != 'true'
        run: npm ci --no-fund || npm install --no-fund

      - name: Install api deps
        if: steps.sync.outputs.skip != 'true'
        working-directory: api
        run: npm ci --legacy-peer-deps

      - name: Build Anarchy manifest
        if: steps.sync.outputs.skip != 'true'
        run: node scripts/build-anarchy.mjs

      - name: Show diff stat
        if: steps.sync.outputs.skip != 'true'
        run: |
          echo "=== public/data/anarchy/ ==="
          ls -lh public/data/anarchy/ || true
          wc -c public/data/anarchy/index.json || true
          echo "=== git status ==="
          git status --short public/data/anarchy/ threat-intel-staging/anarchy.json | head -20
          echo "=== staging ==="
          ls -lh threat-intel-staging/anarchy.json || true

      - name: Check for changes
        id: changes
        if: steps.sync.outputs.skip != 'true'
        run: |
          git add public/data/anarchy/ threat-intel-staging/anarchy.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit/deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will commit."
            git diff --cached --stat
          fi

      - name: Commit to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skip husky/lint-staged — prettier would reformat generated JSON and empty the commit
          git commit --no-verify -m "chore(anarchy): daily sync $(date -u +%Y-%m-%d) — $(jq '.counts.courses' public/data/anarchy/index.json) courses"
          for attempt in 1 2 3; do
            if git push origin main 2>/dev/null; then
              echo "Push succeeded (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
            git pull --rebase origin main || git rebase --abort
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p api/tsconfig.json
          npx tsc --noEmit -p api/tsconfig.worker.json

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Budget check
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/check-budgets.mjs

      # Why a guard instead of more `!= ''` skips: when this repo secret was
      # missing, every deploy step below skipped silently for days while main
      # raced ahead with fresh syncs, and the run stayed green - the live site
      # kept serving stale feeds with nothing in Actions marking why. A missing
      # token is a config error; make the run red instead of quietly stale.
      - name: Require CLOUDFLARE_API_TOKEN for deploy
        if: steps.changes.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing repo secret::CLOUDFLARE_API_TOKEN is not set - deploy steps would skip silently and the live site keeps serving stale feeds while main races ahead."
          echo "Fix: create a Cloudflare API token (Account Resources: Workers Scripts - Edit; User: Memberships + Details - Read) and set the repo secret:"
          echo "  gh secret set CLOUDFLARE_API_TOKEN --repo $GITHUB_REPOSITORY"
          echo "This data run still landed in main; only the deploy was blocked."
          exit 1

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Smoke test
        if: steps.changes.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io/data/anarchy/index.json")
          echo "anarchy index -> HTTP $code"
          test "$code" = "200" || { echo "::error::anarchy index returned HTTP $code"; exit 1; }
          code2=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io/anarchy")
          echo "/anarchy -> HTTP $code2"
          test "$code2" = "200" || { echo "::error::/anarchy returned HTTP $code2"; exit 1; }

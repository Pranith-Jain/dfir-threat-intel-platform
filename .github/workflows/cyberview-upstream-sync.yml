name: CyberView upstream sync (change-detected)

# Mirrors xanderhutch/CyberView. Upstream can trigger this instantly via
# repository_dispatch (event: upstream-update); the cron is a backstop. The
# sync script compares upstream main/data SHAs and skips cloning entirely when
# nothing changed, so quiet ticks do nothing.
#
# Data + source changes are committed straight to main (no PR), which triggers
# the normal CI deploy. No PR is opened for a data mirror.

on:
  repository_dispatch:
    types: [upstream-update, cyberview-update]
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: cyberview-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sync from upstream repo
        run: node scripts/sync-cyberview.mjs

      - name: Check for changes
        id: changes
        run: |
          git add public/data/cyberview/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CyberView upstream unchanged — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -10
          fi

      - name: Commit to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "chore(cyberview): mirror upstream repo changes"
          for attempt in 1 2 3; do
            if git push origin main 2>/dev/null; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing and retrying."
            git pull --rebase origin main || git rebase --abort
          done
          echo "::error::push failed after 3 attempts"
          exit 1

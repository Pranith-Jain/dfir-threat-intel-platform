name: Webamon DTB sync (daily)

# Fetches new Webamon Daily Threat Briefs from GitHub, rebuilds the
# public/data/webamon-dtb/ manifest, commits directly to main, and deploys.
# Fully automated — no PR, no manual steps.
# Runs daily at 13:00 UTC (briefs publish ~12:00 UTC).

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

concurrency:
  group: wdtb-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Install api deps
        working-directory: api
        run: npm ci --legacy-peer-deps

      - name: Sync Webamon DTB
        run: node scripts/sync-webamon-dtb.mjs

      - name: Build manifest
        run: node scripts/build-webamon-dtb.mjs

      - name: Check for changes
        id: changes
        run: |
          git add public/data/webamon-dtb/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new briefs — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Auto/data commits: skip husky/lint-staged (they can reformat the
          # generated minified JSON back to HEAD and make the commit empty,
          # which aborts the whole run). Re-check emptiness ourselves.
          if git diff --cached --quiet HEAD; then
            echo "Nothing to commit after all."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --no-verify -m "chore(wdtb): sync Webamon Daily Threat Brief $(date -u +%Y-%m-%d)"
            # Push may race with other auto-syncs pushing to main — rebase and
            # retry instead of failing the run on a stale ref.
            for attempt in 1 2 3; do
              if git push origin main 2>/dev/null; then
                echo "Push succeeded (attempt $attempt)."
                exit 0
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
              git pull --rebase origin main || git rebase --abort
            done
            echo "::error::push failed after 3 attempts"
            exit 1
          fi

      # ── Deploy (only when data changed) ─────────────────────────────
      # Why a guard instead of more `!= ''` skips: when this repo secret was
      # missing, every deploy step below skipped silently for days while main
      # raced ahead with fresh briefs, and the run stayed green — the live site
      # kept serving a stale Webamon index with nothing in Actions marking
      # why. A missing token is a config error; make the run red instead.
      - name: Require CLOUDFLARE_API_TOKEN for deploy
        if: steps.changes.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing repo secret::CLOUDFLARE_API_TOKEN is not set — deploy steps would skip silently and the live site keeps serving stale data while main races ahead."
          echo "Fix: create a Cloudflare API token (Account Resources: Workers Scripts — Edit; User: Memberships + Details — Read) and set the repo secret:"
          echo "  gh secret set CLOUDFLARE_API_TOKEN --repo $GITHUB_REPOSITORY"
          echo "This data run still landed in main; only the deploy was blocked."
          exit 1

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p api/tsconfig.json
          npx tsc --noEmit -p api/tsconfig.worker.json

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Budget check
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/check-budgets.mjs

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Smoke test
        if: steps.changes.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 8
          # The /api/v1/webamon-dtb/* endpoints are key-gated (external-only auth);
          # the manifest is served publicly via ASSETS, so smoke the data file.
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pranithjain.qzz.io/data/webamon-dtb/index.json")
          echo "/data/webamon-dtb/index.json -> HTTP $code"
          test "$code" = "200" || { echo "::error::webamon-dtb data file returned HTTP $code"; exit 1; }
          briefs=$(curl -s "https://pranithjain.qzz.io/data/webamon-dtb/index.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['counts']['briefs'])" 2>/dev/null || echo 0)
          echo "briefs on live site: $briefs"
          test "$briefs" -ge 3 || { echo "::error::expected at least 3 briefs, got $briefs"; exit 1; }

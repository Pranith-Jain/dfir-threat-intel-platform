name: AXi68 tools sync (daily)

# Daily mirror of tools.axi68.com (OSINT/security tool directory): the static
# card grid is parsed into public/data/axi68-tools/index.json by
# scripts/sync-axi68-tools.mjs (sync + build in one step). If the data
# changed, opens a PR and auto-merges it into main so the data lands the same
# day (same self-deploy pattern as ai-security-sync.yml: GITHUB_TOKEN merges
# do not trigger deploy.yml, so this job builds + deploys itself).
#
# Upstream sitemap lastmod changes every few days; a daily pull keeps drift
# at under a day. Staggered off the other sync slots.

on:
  schedule:
    - cron: '10 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: axi68-tools-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Sync + build AXi68 tool directory
        run: node scripts/sync-axi68-tools.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data/axi68-tools/ changed files ==="
          git status --short public/data/axi68-tools/ | head -20

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(axi68-tools): daily tools.axi68.com sync'
          title: "AXi68 tools upstream sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated daily sync of the tools.axi68.com mirror.

            Re-runs `scripts/sync-axi68-tools.mjs`: parses the upstream card
            grid (name, URL, category, free/paid tag, note) into
            `public/data/axi68-tools/index.json` backing
            /threatintel/osint/ax-tools. The PR is auto-merged by the same
            run (data-only changes), and the self-deploy below publishes the
            merge.

            Source: https://tools.axi68.com

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/axi68-tools-sync
          delete-branch: true
          add-paths: |
            public/data/axi68-tools/

      - name: Auto-merge sync PR
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --merge --delete-branch

      # Same guard as ai-security-sync.yml: a missing token must turn the run
      # red, not skip the deploy silently while main races ahead.
      - name: Require CLOUDFLARE_API_TOKEN for self-deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing repo secret::CLOUDFLARE_API_TOKEN is not set - self-deploy steps would skip silently and the live site keeps serving stale data while main races ahead."
          echo "Fix: create a Cloudflare API token (Account Resources: Workers Scripts - Edit; User: Memberships + Details - Read) and set the repo secret:"
          echo "  gh secret set CLOUDFLARE_API_TOKEN --repo $GITHUB_REPOSITORY"
          echo "The sync PR still auto-merged into main; only the deploy was blocked."
          exit 1

      # ── Self-deploy (only when the sync PR actually landed) ──────────
      - name: Checkout merged main
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node for deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install for deploy
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci --no-fund || npm install --no-fund
          cd api && npm ci --legacy-peer-deps

      - name: Build
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Smoke test AXi68 tool data
        if: steps.pr.outputs.pull-request-number != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (compatible; smoke/1.0)" "https://pranithjain.qzz.io/data/axi68-tools/index.json")
          echo "axi68-tools index -> HTTP $code"
          if [ "$code" = "403" ]; then
              echo "::warning::the manifest keeps returning HTTP 403 from the runner IP — Cloudflare bot mitigation (site verified reachable outside runners); not a deploy regression."
            elif [ "$code" != "200" ]; then
              echo "::error::the manifest returned HTTP $code"; exit 1
            fi

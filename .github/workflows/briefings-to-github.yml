name: Export briefings to GitHub

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC daily (after the 00:30 briefing build)
  workflow_dispatch:

concurrency:
  group: briefings-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export briefings from D1
        id: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — skipping briefings export (set it in repo Settings > Secrets to enable)."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_ACCOUNT_ID secret is not set — skipping briefings export."
            exit 0
          fi
          # Keep every brief: never wipe briefings/. The exporter writes all
          # D1 briefs and skips historical files already on disk.
          node scripts/export-briefings-to-github.mjs
          # Empty-output guard: if the exporter wrote 0 files and the folder is
          # empty, abort before the commit step can record a mass deletion.
          if [ -z "$(ls -A briefings 2>/dev/null)" ]; then
            echo "::error::exporter produced 0 briefing files — aborting (not committing a deletion)."
            exit 1
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Commit and push briefings to main
        # Gate on the export step: when it skips (no token / no account id),
        # `briefings/` was never created and `git add briefings/` would fail
        # the whole run with "pathspec did not match any files".
        if: steps.export.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync PANOPTICON briefings $(date -u +%Y-%m-%d)"
            # Retry a few times — this repo's main moves fast (auto-FF merges).
            for i in 1 2 3; do
              if git pull --rebase origin main 2>/dev/null && git push origin main; then
                echo "::notice::Pushed $(git diff --name-only HEAD~1 HEAD | wc -l) briefing files"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Could not push after 3 attempts (main kept moving)."
            exit 1
          fi

      # Permanent archive: mirror the exact same briefings/ folder to the
      # daily-threat-brief repo. Its own generator is disabled there so this
      # mirror is the single source of truth. GH_PAT needs repo write access
      # on Pranith-Jain/daily-threat-brief.
      - name: Mirror briefings to daily-threat-brief
        if: steps.export.outputs.skipped != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT is not set — skipping the daily-threat-brief mirror."
            exit 0
          fi
          rm -rf /tmp/daily-threat-brief-mirror
          git clone --quiet "https://x-access-token:${GH_PAT}@github.com/Pranith-Jain/daily-threat-brief.git" /tmp/daily-threat-brief-mirror
          mkdir -p /tmp/daily-threat-brief-mirror/briefings
          cp briefings/*.md /tmp/daily-threat-brief-mirror/briefings/
          cd /tmp/daily-threat-brief-mirror
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/
          if git diff --cached --quiet; then
            echo "No mirror changes."
          else
            git commit -m "chore: mirror PANOPTICON briefings $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git pull --no-rebase origin main && git push origin main; then
                echo "::notice::Mirrored $(git diff --name-only HEAD~1 HEAD | wc -l) briefing files to daily-threat-brief"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Could not push the mirror after 3 attempts."
            exit 1
          fi

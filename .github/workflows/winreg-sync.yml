name: WinReg upstream sync (weekly)

# Re-fetches the dfir-scripts Windows Registry artifact schema from upstream
# and rebuilds the public/data/winreg/ manifest. If the data changed, opens
# a PR with the diff so a human can review + merge.

on:
  schedule:
    # Thursdays 06:00 UTC (keeps it off the Tuesday sigbase and Monday SI syncs).
    - cron: "0 6 * * 4"
  workflow_dispatch: {}

concurrency:
  group: winreg-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Build manifest
        run: node scripts/build-winreg-manifest.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data/winreg/ changed files ==="
          git status --short public/data/winreg/ | head -40

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(winreg): sync from dfir-scripts registry schema"
          title: "WinReg upstream sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly sync from
            [dfir-scripts.github.io/registry](https://dfir-scripts.github.io/registry/).

            Re-runs `scripts/build-winreg-manifest.mjs` (fetches the upstream
            schema JSON and slices it into `public/data/winreg/`). Review the
            diff and merge if the upstream content is what we want.

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/winreg-upstream-sync
          delete-branch: true
          add-paths: |
            public/data/winreg/

      - name: Auto-merge sync PR
        # The sync output is data-only and main is unprotected, so the PR
        # merges itself here — no human in the loop for the routine data land.
        # (create-pull-request outputs nothing when there were no changes.)
        # The shared script tolerates the non-required `Workers Builds:`
        # Cloudflare watcher check failing on bot PRs, which left these PRs
        # UNSTABLE and unmerged for days (see the script header).
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/automerge-sync-pr.sh "${{ steps.pr.outputs.pull-request-number }}"

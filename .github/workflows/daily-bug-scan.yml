name: Daily bug & security scan

# Daily automated scan over the codebase, logging findings to GitHub issues.
#
# Methodology mirrors docs/loops/security-review-the-diff.md (the repo's own
# review loop): grep-driven checks per category. Findings are opened as
# issues labeled `automated` + `security` (or `bug` for non-security), and
# deduplicated: one rolling tracking issue per scanner ID ("[scan] <id>")
# — a repeat finding updates/watermarks the existing issue instead of
# spamming a new one per day. Fixed findings close the tracking issue with
# a "no longer detected" comment, so the issue doubles as the fix record.
#
# Checks (all static analysis, no deploys, no prod traffic):
#   A. Secret-pattern scan over tracked source (defence-in-depth on top of
#      the gitleaks CI step — catches patterns gitleaks rules miss).
#   B. SSRF dataflow (scripts/scan-ssrf.mjs): a value read from
#      c.req.query/param used as the FIRST ARGUMENT of fetch() — the one
#      position where user input becomes the request host. The previous
#      implementation was a grep for "reads a url param AND does not mention
#      ssrf-guard", which flagged any handler that merely READ a url-ish param.
#      Eight of its nine hits passed the value as an encodeURIComponent'd query
#      parameter or a JSON body field to a fixed upstream — not SSRF-reachable.
#      That noise buried the one real finding (#298) inside the same list.
#   B2. Correctness gates (scripts/scan-gates.mjs): lockfile/manifest drift,
#      missing workflow concurrency groups, colliding concurrency group names,
#      scheduled workflows with branch filters, and analysis configs that
#      nothing runs. Each is a silent failure that greps cannot see.
#   C. Dangerous HTML sinks: dangerouslySetInnerHTML fed from a variable that
#      was never produced by DOMPurify / renderMarkdown / a `<`-escaped
#      JSON-LD literal in the same file.
#   D. Raw template-literal SQL: .prepare(`...${...}`) where the interpolated
#      expression is NOT a known-constant identifier or a bound `?`.
#   E. Non-constant-time secret compares (== / String.startsWith on tokens).
#   F. Typecheck gate: the three tsc projects must pass (esbuild deploys
#      past tsc — per CLAUDE.md this is where errors accumulate silently).
#
# Escalation ladder: new findings → NEW issue, updated watermark → comment on
# the existing issue, all-clear → nothing (summary shows the zero table).
# Exit code: 1 only when a NEW security finding was opened (page-worthy).

on:
  schedule:
    # Daily 09:00 UTC — after daily-automerge (08:30) so scan findings land
    # once the merge wave has settled.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-bug-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # persist-credentials false is fine here: the scanner's gh calls
          # pass GH_TOKEN explicitly, so no checkout credential leakage.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run scanner (secrets, SSRF, HTML sinks, SQL, timing, tsc)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p /tmp/scan
          SRC_DIRS="src api/src worker scripts eslint-rules"
          today="$(date -u +%F)"

          record() { # record <id> <severity> <title> <body-file>
            printf '%s' "$2" > "/tmp/scan/$1.sev"
            printf '%s' "$3" > "/tmp/scan/$1.title"
            if [ "$4" != "/tmp/scan/$1.body" ]; then cp "$4" "/tmp/scan/$1.body"; fi
          }

          # ── A. Secret patterns ─────────────────────────────────────────
          secret_hits="$(grep -rInE \
            'gh[oprus]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z]+ PRIVATE KEY-----' \
            $SRC_DIRS --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
            2>/dev/null | grep -v '\.test\.' \
            | grep -vE 'placeholder|example|EXAMPLE|sev:|re: /|detector|pattern|DlpScan|SecretScanner|MedusaScanner|McpAudit' | head -20 || true)"
          if [ -n "$secret_hits" ]; then
            { printf '```\n%s\n```\n' "$secret_hits"
              printf '_Scanner A: secret-pattern grep over tracked source. Verify each hit; the gitleaks CI step may already cover some._\n'; } > /tmp/scan/A.body
            record A high "Secret-pattern hits in tracked source" /tmp/scan/A.body
          fi

          # ── B. SSRF dataflow ──────────────────────────────────────────
          # Delegates to scripts/scan-ssrf.mjs, which does the analysis inline:
          # it tracks a `c.req.query/param` assignment to a bare identifier and
          # reports only that identifier appearing as fetch()'s FIRST argument.
          #
          # This replaces a grep that flagged any route merely READING a url-ish
          # query param. Eight of its nine hits were encodeURIComponent'd query
          # params or JSON body fields sent to a fixed upstream — shapes that
          # cannot change the request host — and that noise is why the one real
          # finding (#298) was easy to overlook. Suppression is automatic for
          # files using a guard fetcher, and via a `// ssrf-audit: accept-reason`
          # annotation for false positives the guard grep cannot see (e.g.
          # .onion-only input behind a fixed tor2web gateway).
          if ssrf_out="$(node scripts/scan-ssrf.mjs 2>/tmp/scan/B.err)"; then
            ssrf_out=""
          else
            ssrf_rc=$?
            [ "$ssrf_rc" = 2 ] && ssrf_out="scanner error: $(cat /tmp/scan/B.err)"
          fi
          if [ -n "$ssrf_out" ]; then
            { printf 'A request value is used as the **host** of an outbound fetch:\n\n'
              printf '```\n%s\n```\n' "$ssrf_out"
              printf '_Scanner B: this is the #298 shape — `fetch(<user value>)` lets a caller point the fetch at an internal address (169.254.169.254 metadata, loopback, RFC1918), because Worker egress is not loopback._\n\n'
              printf '_Fix: `pinnedFetchFollow()` from `api/src/lib/ssrf-guard.ts` (re-validates + pins every redirect hop, which also defeats DNS rebinding) plus a host allow-list derived from the shipped manifest — see the threat-monitor fix in fd0dfc7 for the worked example. If this is a false positive, annotate the file `// ssrf-audit: accept-reason <why>` and this check will skip it from then on._\n'; } > /tmp/scan/B.body
            record B high "Request value used as a fetch host (SSRF)" /tmp/scan/B.body
          fi

          # ── B2. correctness gates ─────────────────────────────────────
          # Lockfile/manifest drift, missing or colliding workflow concurrency
          # groups, branch filters silently disabling a schedule, and analysis
          # configs nothing runs. All are silent failures greps cannot see.
          if gates_out="$(node scripts/scan-gates.mjs 2>&1)"; then
            gates_out=""
          fi
          if [ -n "$gates_out" ]; then
            printf '%s\n' "$gates_out" > /tmp/scan/B2.body
            record B2 medium "Repo-hygiene gates failing" /tmp/scan/B2.body
          fi

          # ── C. dangerous HTML sinks ───────────────────────────────────
          # Per-sink logic: a hit is real only when within the 9 lines after
          # `__html:` there is NO escape chain (`replace(/&/g`) and the
          # expression itself is not a known-safe producer (allow-list
          # verified in docs/audits/2026-10-09-security-audit.md):
          # DOMPurify output, renderMarkdown, `<`-escaped JSON-LD.
          sink_hits=""
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            hf="${hit%%:*}"; hl="${hit#*:}"; hl="${hl%%:*}"
            window="$(sed -n "${hl},$((hl + 9))p" "$hf")"
            if ! printf '%s\n' "$window" | grep -q 'replace(/&/g'; then
              sink_hits="${sink_hits}${hit}
          "
            fi
          done < <(grep -rn 'dangerouslySetInnerHTML' $SRC_DIRS --include='*.tsx' 2>/dev/null \
            | grep -E '__html:' \
            | grep -vE '__html:\s*(JSON\.stringify|safe[A-Za-z]*|sanitiz|sanitis|renderMarkdown|narrativeHtml|explainText|html|proseHtml)' \
            | head -20 || true)
          if [ -n "$sink_hits" ]; then
            { printf '```\n%s\n```\n' "$sink_hits"
              printf '_Scanner C: dangerouslySetInnerHTML whose expression is not on the known-safe producer list (DOMPurify output / renderMarkdown / escaped JSON-LD). Verify each._\n'; } > /tmp/scan/C.body
            record C medium "Unverified dangerouslySetInnerHTML expressions" /tmp/scan/C.body
          fi

          # ── D. raw template-literal SQL with interpolation ────────────
          sql_hits="$(grep -rnE '\.prepare\(`[^`]*\$\{' api/src --include='*.ts' 2>/dev/null \
            | grep -vE '\$\{[A-Z][A-Z0-9_]*\}|\$\{placeholders\}|\$\{where\}|\$\{whereClause\}|\$\{(table|column|sets|bundleJson)' | head -20 || true)"
          if [ -n "$sql_hits" ]; then
            # Drop hits from files a human triaged and annotated
            # `// sql-audit: accept-reason <why>` — the same suppression contract
            # check B uses for `ssrf-audit: accept-reason`. Without it a reviewed
            # false positive is re-reviewed every single day, which is what made
            # this check's signal decay.
            sql_hits="$(printf '%s\n' "$sql_hits" | while IFS= read -r hit; do
              [ -z "$hit" ] && continue
              sf="${hit%%:*}"
              if grep -q 'sql-audit: accept-reason' "$sf" 2>/dev/null; then continue; fi
              printf '%s\n' "$hit"
            done)"
          fi
          if [ -n "$sql_hits" ]; then
            { printf '```\n%s\n```\n' "$sql_hits"
              printf '_Scanner D: interpolated SQL fragments. D1 cannot bind identifiers, so a table/column name in a template literal is expected — what matters is whether the interpolated value can be attacker-controlled._\n\n'
              printf '_Safe when: the identifier comes from a hardcoded constant or is validated against an allow-list (see the retention identifier guard in api/src/lib/retention.ts), or the fragment is a fixed literal pushed by the code with user input only in `.bind()`._\n'
              printf '_False positive? Annotate the file `// sql-audit: accept-reason <why>` and this check will skip it from then on._\n'; } > /tmp/scan/D.body
            record D high "Interpolated SQL in .prepare() template literals" /tmp/scan/D.body
          fi

          # ── E. non-constant-time token compares ───────────────────────
          timing_hits="$(grep -rnE '(===|!==|==|!=)\s*(env\.(ADMIN_TOKEN|API_[A-Z_]*|INTERNAL_TOKEN)[^ ]*|[A-Za-z_]*[Tt]oken\s*)' api/src worker --include='*.ts' 2>/dev/null \
            | grep -vE '\.length|test|\.test\.' | head -10 || true)"
          if [ -n "$timing_hits" ]; then
            # Same annotation contract as B and D: `// timing-audit: accept-reason`.
            timing_hits="$(printf '%s\n' "$timing_hits" | while IFS= read -r hit; do
              [ -z "$hit" ] && continue
              tf="${hit%%:*}"
              if grep -q 'timing-audit: accept-reason' "$tf" 2>/dev/null; then continue; fi
              printf '%s\n' "$hit"
            done)"
          fi
          if [ -n "$timing_hits" ]; then
            { printf '```\n%s\n```\n' "$timing_hits"
              printf '_Scanner E: direct equality compares on a value named `token`/`*_token`. The regex cannot tell a SECRET from a same-named non-secret._\n\n'
              printf '_Use safeEqual() (api/src/lib/safe-equal.ts) when the value is a bearer capability or credential — a lease token, an admin token, an HMAC. Plain `===` is correct when it is not: a crypto asset SYMBOL (`USDT`), an enum, a status string._\n'
              printf '_False positive? Annotate the file `// timing-audit: accept-reason <why>` and this check will skip it from then on._\n'; } > /tmp/scan/E.body
            record E medium "Non-constant-time secret comparisons" /tmp/scan/E.body
          fi

          # ── F. typecheck gate (the three tsc projects) ────────────────
          npm ci --no-fund --silent || npm install --no-fund --silent
          # One entry per project, tab-separated: <label>\t<project-path|NONE>.
          # A plain `for proj in ... -p api/x.json` word-splits on spaces, so the
          # loop body received a bare `-p` and tsc failed with
          # "TS5058: The specified path does not exist: '-p'" (#308) — a scanner
          # false positive that masked real typecheck failures. Keep each project
          # path a single quoted token.
          typecheck_fail=""
          while IFS=$'\t' read -r proj_label proj_path; do
            [ -n "${proj_label:-}" ] || continue
            log="/tmp/scan/F-tsc-${proj_label}.log"
            if [ "$proj_path" = "NONE" ]; then
              # Root project: tsconfig.json sits at the repo root, so tsc picks
              # it up implicitly. --skipLibCheck matches its own compilerOptions.
              node node_modules/typescript/bin/tsc --noEmit --skipLibCheck > "$log" 2>&1 \
                || typecheck_fail="${typecheck_fail}${proj_label}
          "
            else
              node node_modules/typescript/bin/tsc --noEmit -p "$proj_path" > "$log" 2>&1 \
                || typecheck_fail="${typecheck_fail}${proj_label}
          "
            fi
          done <<'PROJECTS'
          root	NONE
          api	api/tsconfig.json
          worker	api/tsconfig.worker.json
          PROJECTS
          if [ -n "$typecheck_fail" ]; then
            # Only print logs for projects that actually failed — globbing all
            # F-tsc-*.log also drags in empty logs from passing projects, which
            # made the report look like it had empty errors for them.
            { printf 'Failing projects:\n\n```\n%s```\n\n' "$typecheck_fail"
              printf 'First errors per project:\n\n'
              printf '%s\n' "$typecheck_fail" | while IFS= read -r proj_label; do
                [ -n "${proj_label:-}" ] || continue
                lg="/tmp/scan/F-tsc-${proj_label}.log"
                printf '#### %s\n\n```\n' "$(basename "$lg")"
                head -15 "$lg"
                printf '```\n\n'
              done; } > /tmp/scan/F.body
            record F high "Typecheck regression (esbuild deploys past tsc)" /tmp/scan/F.body
          fi

          echo "## Scan A–F + B2: $(date -u +%F)" > /tmp/scan/summary.md
          # B2 sits next to B because it is a different class (hygiene, not a
          # code pattern) but shares the SSRF-adjacent blast radius.
          for k in A B B2 C D E F; do
            if [ -f "/tmp/scan/$k.title" ]; then
              echo "- 🔴 [$k] $(cat /tmp/scan/$k.title)" >> /tmp/scan/summary.md
            else
              echo "- ✅ [$k] clean" >> /tmp/scan/summary.md
            fi
          done
          cat /tmp/scan/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or watermark tracking issues + auto-close fixed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          today="$(date -u +%F)"
          repo_owner="${GITHUB_REPOSITORY%%/*}"; repo_name="${GITHUB_REPOSITORY#*/}"

          ls /tmp/scan/*.title 2>/dev/null || true
          SHAS=$(git rev-parse --short HEAD)

          # id → issue number via marker search
          issue_for_id() {
            gh issue list --state open --search "[scan] $1 in:title" \
              --json number -q '.[0].number' 2>/dev/null | head -1
          }

          any_new=0; any_repeat=0
          for f in /tmp/scan/*.title; do
            [ -e "$f" ] || continue
            id="$(basename "$f" .title)"
            sev="$(cat "/tmp/scan/$id.sev")"
            title="$(cat "$f")"
            body="$(cat "/tmp/scan/$id.body")"

            label="security"; [ "$id" = "F" ] && label="bug"
            existing="$(issue_for_id "$id")"

            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "🔁 Still detected at commit \`$SHAS\` ($today). Updated evidence:

          $body" >/dev/null 2>&1 || true
              any_repeat=$((any_repeat+1))
            else
              gh issue create \
                --title "[scan] $id — $title" \
                --label "$label,automated" \
                --body "🤖 Daily scanner finding at commit \`$SHAS\` ($today). Severity bucket: \`$sev\`.

          $body

          _This issue is a rolling tracker: the scanner watermarks it while the finding persists and closes it automatically once a scan no longer detects it (typecheck/scan regression scanners only)._"
              any_new=$((any_new+1))
            fi
          done

          # Auto-close trackers for scanner IDs that came up clean today.
          #
          # F (typecheck), B (SSRF dataflow) and B2 (hygiene gates) are
          # DETERMINISTIC: the same commit always yields the same verdict, so a
          # clean scan genuinely means the finding is gone and closing the
          # tracker is correct. C/D/E stay open by design — they are grep
          # heuristics whose hit set shifts as files are added, and auto-closing
          # them would flap the tracker open and shut every refactor.
          for id in F B B2; do
            case "$id" in
              F)  label="typecheck" ;;
              B)  label="SSRF dataflow" ;;
              B2) label="repo-hygiene gates" ;;
            esac
            for open_num in $(gh issue list --state open --search "[scan] in:title" --json number,title \
               -q ".[] | select(.title | test(\"^\\\\[scan\\\\] $id \")) | .number"); do
              if [ ! -f "/tmp/scan/$id.title" ]; then
                gh issue close "$open_num" --comment "✅ Scanner $id ($label) clean at \`$SHAS\` ($today) — closing; reopened automatically if a later scan fails again." >/dev/null 2>&1 || true
              fi
            done
          done

          echo "new=$any_new repeat=$any_repeat" >> "$GITHUB_STEP_SUMMARY"

      - name: Escalate on new security findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          new_secur="$(gh issue list --state open --search "[scan] in:title author:app/github-actions" --json number \
            -q '[.[] | .number] | length' 2>/dev/null || echo 0)"
          # Reached only via step 2 side effects; simpler signal: did step 2
          # create any NEW issue today? Re-derive from the summary artifact.
          if [ -f /tmp/scan/F.title ] || grep -qE 'new=[1-9]' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "::error::New scan finding(s) opened as issues today — triage required"
            exit 1
          fi

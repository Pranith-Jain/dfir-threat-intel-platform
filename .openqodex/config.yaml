# OpenQodex configuration for dfir-threat-intel-platform.
# Every key is optional; the defaults OpenQodex ships are commented in.
# Read docs/config.md (`npx openqodex guide config`) for what each key does.

version: 1

review:
  # Findings below this severity stay out of the report.
  severity_threshold: minor

  # Never block: unset means the verdict warns but no command exits 1 and the
  # push gate never denies a push. Set one of critical, major, minor, nitpick,
  # info to gate pushes.
  # block_on_severity: critical

  paths:
    # Generated content, not hand-written source. Kept out of the change so the
    # scanners and the reviewer spend their budget on code. Everything else the
    # repo builds is already hidden by .gitignore (dist, .ssr-build, .wrangler,
    # node_modules, coverage, artifacts).
    exclude:
      # 9,687 machine-written JSON files (breach-watch, CTI feeds, generated by
      # scripts/build-breach-watch.mjs and friends).
      - public/data/**
      # 516 KB of Wrangler-generated Cloudflare Worker types.
      - worker-configuration.d.ts
      # Binary assets.
      - public/textures/**
      - public/tesseract/**
      - public/fonts/**

  # Findings in test fixtures, mocks and snapshots are dropped by default.
  include_fixtures: false

scanners:
  # Nothing disabled: all 22 built-ins stay on.
  disable: []
  custom: []

graph:
  enabled: true
  # The repo has ~2,500 code files; the defaults (4,000 files, 10s, 1.5 GB)
  # are enough, but give the graph room since a whole-repo run parses
  # everything at once.
  max_files: 4000
  budget_ms: 30000